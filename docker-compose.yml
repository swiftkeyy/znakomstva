version: "3.9"

services:
  bot:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
      - ollama
    ports:
      - "8000:8000"
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dating_bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: >
      sh -c "
        sleep 5 &&
        ollama pull qwen3:14b &&
        ollama pull qwen3-vl:7b &&
        ollama pull deepseek-r1:14b
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  ollama_data:
